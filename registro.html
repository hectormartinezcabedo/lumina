<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro | Lúmina</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-split">
    <div class="login-split__image" style="background: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=1000&auto=format&fit=crop') center/cover;">
      <div style="width: 100%; height: 100%; background: rgba(0,0,0,0.4); padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; color: white;">
        <h2 style="font-family: var(--font-serif); font-size: 2rem;">lúmina.</h2>
        <div>
          <h1 style="font-size: 3.5rem; line-height: 1.1; font-family: var(--font-serif); margin-bottom: 1rem;">Las mejores historias merecen ser recordadas.</h1>
        </div>
      </div>
    </div>

    <div class="login-split__form">
      <div style="max-width: 400px; margin: 0 auto; width: 100%;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--color-text-muted); display: block; margin-bottom: 3rem;">← Volver al inicio</a>
        
        <h1 style="font-size: 2.5rem; margin-bottom: 2rem; color: var(--color-text-main);">Crea tu cuenta.</h1>

        <form id="registro-form" action="index.html" novalidate>
          <div class="form-summary" role="alert" hidden></div>
          <div class="form-group">
            <label for="reg-nombre">Nombre completo</label>
            <input type="text" id="reg-nombre" name="nombre" class="form-control" placeholder="Tu nombre" autocomplete="name" data-rules="required|name|minlength:3">
          </div>
          <div class="form-group">
            <label for="reg-email">Correo electrónico</label>
            <input type="email" id="reg-email" name="email" class="form-control" placeholder="tu@email.com" autocomplete="email" data-rules="required|email">
          </div>
          <div class="form-group">
            <label for="reg-nacimiento">Fecha de nacimiento</label>
            <input type="date" id="reg-nacimiento" name="nacimiento" class="form-control" data-rules="required|date|adult">
          </div>
          <div class="form-group">
            <label for="reg-pass">Contraseña</label>
            <input type="password" id="reg-pass" name="password" class="form-control" placeholder="Mín. 8 caracteres, mayúscula y número" autocomplete="new-password" data-rules="required|password">
            <div class="password-strength" data-score="0" aria-hidden="true">
              <div class="password-strength__bar"><span></span><span></span><span></span><span></span></div>
              <span class="password-strength__label"></span>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-pass2">Repite la contraseña</label>
            <input type="password" id="reg-pass2" name="password2" class="form-control" placeholder="Repite tu contraseña" autocomplete="new-password" data-rules="required|match:#reg-pass">
          </div>
          <div class="form-group">
            <label class="form-check">
              <input type="checkbox" id="reg-terminos" name="terminos" data-rules="checked">
              Acepto los términos y la política de privacidad
            </label>
          </div>
          <button type="submit" class="btn btn--primary btn--block" style="margin-top: 1rem;">Crear cuenta →</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem; color: var(--color-text-muted);">¿Ya tienes cuenta? <a href="login.html" style="color: var(--color-primary); font-weight: 600;">Inicia sesión</a></p>
      </div>
    </div>
  </div>
  <script src="js/ui.js"></script>
  <script src="js/validation.js"></script>
</body>
</html>
