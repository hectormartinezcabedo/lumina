<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Lúmina</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-split">
    <div class="login-split__image" style="background: url('https://images.unsplash.com/photo-1516035069371-29a1b244cc32?q=80&w=1000&auto=format&fit=crop') center/cover;">
      <div style="width: 100%; height: 100%; background: rgba(0,0,0,0.4); padding: 3rem; display: flex; flex-direction: column; justify-content: space-between; color: white;">
        <h2 style="font-family: var(--font-serif); font-size: 2rem;">lúmina.</h2>
        <div>
          <h1 style="font-size: 3.5rem; line-height: 1.1; font-family: var(--font-serif); margin-bottom: 1rem;">Las mejores historias merecen ser recordadas.</h1>
          <p style="font-size: 0.8rem; opacity: 0.8; letter-spacing: 1px;">UN ESPACIO PARA CREAR Y RECORDAR</p>
        </div>
      </div>
    </div>

    <div class="login-split__form">
      <div style="max-width: 400px; margin: 0 auto; width: 100%;">
        <a href="index.html" style="font-size: 0.85rem; color: var(--color-text-muted); display: block; margin-bottom: 3rem;">← Volver al inicio</a>
        
        <p style="font-size: 0.8rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 0.5rem;">Bienvenido a Lúmina</p>
        <h1 style="font-size: 2.8rem; margin-bottom: 0.5rem; color: var(--color-text-main); line-height: 1.1;">Qué alegría verte de nuevo.</h1>
        <p style="color: var(--color-text-muted); margin-bottom: 2.5rem; font-size: 0.95rem;">Accede a tu espacio y sigue donde lo dejaste.</p>

        <div style="display: flex; gap: 2rem; margin-bottom: 2rem; border-bottom: 1px solid var(--color-border);">
          <span style="padding-bottom: 0.8rem; border-bottom: 2px solid var(--color-primary); font-weight: 600; font-size: 0.9rem; color: var(--color-primary);">Iniciar sesión</span>
          <a href="registro.html" style="padding-bottom: 0.8rem; font-size: 0.9rem; color: var(--color-text-muted);">Crear cuenta</a>
        </div>

        <form action="index.html">
          <div class="form-group">
            <label>Correo electrónico</label>
            <input type="email" class="form-control" placeholder="tu@email.com" required>
          </div>
          <div class="form-group">
            <label>Contraseña</label>
            <input type="password" class="form-control" placeholder="Mínimo 8 caracteres" required>
          </div>
          <button type="submit" class="btn btn--primary btn--block" style="margin-top: 1rem;">Entrar en mi cuenta →</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
